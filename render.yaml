services:
  - type: web
    name: neuroverse-backend
    runtime: python
    plan: free
    rootDir: ./Backend
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: DATABASE_URL
        value: sqlite:///./neuroverse.db
