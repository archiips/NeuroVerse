services:
  - type: web
    name: neuroverse-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neuroverse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.9"

databases:
  - name: neuroverse-db
    databaseName: neuroverse
    user: neuroverse
