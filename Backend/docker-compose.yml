version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: neuroverse
      POSTGRES_PASSWORD: neuroverse
      POSTGRES_DB: neuroverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://neuroverse:neuroverse@db:5432/neuroverse
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
